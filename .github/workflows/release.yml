name: Release SparkleReleaseKit

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    environment: release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_commit="$(/usr/bin/git rev-parse "$GITHUB_REF_NAME^{commit}")"
          /usr/bin/git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || {
            echo "Release tag must point to a commit reachable from origin/main." >&2
            exit 1
          }
          grep -F "[$version]" CHANGELOG.md
          grep -F "public static let current = \"$version\"" Sources/SparkleReleaseKitCore/Models.swift

      - name: Run complete validation suite
        run: scripts/run-tests.sh

      - name: Build universal release binary
        run: swift build --configuration release --arch arm64 --arch x86_64

      - name: Import optional protected Developer ID identity
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          echo "identity=-" >> "$GITHUB_OUTPUT"
          if [[ -z "${CERTIFICATE_BASE64:-}" && -z "${CERTIFICATE_PASSWORD:-}" ]]; then
            echo "No Developer ID identity configured; producing the documented ad-hoc ZIP."
            exit 0
          fi
          if [[ -z "${CERTIFICATE_BASE64:-}" || -z "${CERTIFICATE_PASSWORD:-}" ]]; then
            echo "Developer ID release credentials are incomplete." >&2
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/sparklekit-release.keychain-db"
          certificate="$RUNNER_TEMP/developer-id-application.p12"
          keychain_password="$(/usr/bin/uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 --decode > "$certificate"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null
          identity="$(
            /usr/bin/security find-identity -v -p codesigning "$keychain" |
              /usr/bin/awk -F '"' '/Developer ID Application/{print $2; exit}'
          )"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          /bin/rm -f "$certificate"

      - name: Package signed CLI and build metadata
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        shell: bash
        run: |
          set -euo pipefail
          product_dir=".build/apple/Products/Release"
          mkdir -p dist/SparkleReleaseKit
          cp "$product_dir/sparklekit" dist/SparkleReleaseKit/
          cp -R "$product_dir/SparkleReleaseKit_SparkleReleaseKitCore.bundle" dist/SparkleReleaseKit/
          cp scripts/install.sh dist/SparkleReleaseKit/install.sh
          cp README.md CHANGELOG.md LICENSE SECURITY.md AGENTS.md llms.txt dist/SparkleReleaseKit/
          cp -R AI docs examples schemas dist/SparkleReleaseKit/
          lipo -info dist/SparkleReleaseKit/sparklekit
          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --keychain "$SIGNING_KEYCHAIN" \
              --sign "$SIGNING_IDENTITY" \
              dist/SparkleReleaseKit/sparklekit
          else
            codesign \
              --force \
              --sign - \
              --timestamp=none \
              dist/SparkleReleaseKit/sparklekit
          fi
          codesign --verify --strict --verbose=2 dist/SparkleReleaseKit/sparklekit
          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            codesign -d --verbose=4 dist/SparkleReleaseKit/sparklekit 2>&1 |
              grep -F "runtime"
          fi

          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export SOURCE_COMMIT="$GITHUB_SHA"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SWIFT_VERSION="$(swift --version | head -1)"
          export XCODE_VERSION="$(xcodebuild -version | tr '\n' ' ')"
          export SIGNING_MODE
          python3 - <<'PY'
          import json
          import os

          metadata = {
              "schemaVersion": 1,
              "version": os.environ["RELEASE_VERSION"],
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "sourceDateEpoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "swiftVersion": os.environ["SWIFT_VERSION"],
              "xcodeVersion": os.environ["XCODE_VERSION"].strip(),
              "minimumMacOS": "13.0",
              "architectures": ["arm64", "x86_64"],
              "sparkleCompatibility": "2.9.4",
              "signingMode": os.environ["SIGNING_MODE"],
              "workflowRun": os.environ["GITHUB_RUN_ID"],
          }
          with open("sparklekit-build-metadata.json", "w", encoding="utf-8") as stream:
              json.dump(metadata, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          cp sparklekit-build-metadata.json dist/SparkleReleaseKit/

          timestamp="$(date -u -r "$SOURCE_DATE_EPOCH" +%Y%m%d%H%M.%S)"
          find dist/SparkleReleaseKit -exec touch -h -t "$timestamp" {} +
          ditto -c -k --sequesterRsrc --keepParent \
            dist/SparkleReleaseKit \
            SparkleReleaseKit-macos.zip
          shasum -a 256 SparkleReleaseKit-macos.zip > SparkleReleaseKit-macos.zip.sha256

      - name: Create and verify signed self-update manifest
        shell: bash
        env:
          SPARKLEKIT_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.SPARKLEKIT_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLEKIT_UPDATE_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Protected self-update signing key is not configured." >&2
            exit 1
          fi
          swift scripts/create-update-manifest.swift \
            --version "${GITHUB_REF_NAME#v}" \
            --asset SparkleReleaseKit-macos.zip \
            --asset-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/SparkleReleaseKit-macos.zip" \
            --source-commit "$GITHUB_SHA" \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --note "Security and maintenance improvements for SparkleReleaseKit." \
            --note "See the signed release and CHANGELOG for complete details." \
            --output sparklekit-update-manifest.json \
            --signature-output sparklekit-update-manifest.json.sig
          dist/SparkleReleaseKit/sparklekit update verify-manifest \
            --manifest sparklekit-update-manifest.json \
            --signature sparklekit-update-manifest.json.sig \
            --json >/dev/null
          python3 -m json.tool sparklekit-update-manifest.json >/dev/null

      - name: Create optional notarized and stapled disk image
        id: notarization
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$SIGNING_MODE" != "developer-id" ]]; then
            echo "Notarized DMG skipped because no Developer ID identity is configured."
            exit 0
          fi
          if [[ -z "${NOTARY_KEY_BASE64:-}" || -z "${NOTARY_KEY_ID:-}" || -z "${NOTARY_ISSUER_ID:-}" ]]; then
            echo "Developer ID releases require complete protected notarization credentials." >&2
            exit 1
          fi
          umask 077
          notary_key="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 --decode > "$notary_key"
          hdiutil create \
            -quiet \
            -volname "SparkleReleaseKit" \
            -srcfolder dist/SparkleReleaseKit \
            -ov \
            -format UDZO \
            SparkleReleaseKit-macos.dmg
          xcrun notarytool submit SparkleReleaseKit-macos.dmg \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --timeout 20m
          xcrun stapler staple SparkleReleaseKit-macos.dmg
          xcrun stapler validate SparkleReleaseKit-macos.dmg
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            SparkleReleaseKit-macos.dmg
          mountpoint="$RUNNER_TEMP/sparklekit-notarized"
          mkdir -p "$mountpoint"
          hdiutil attach \
            -quiet \
            -nobrowse \
            -readonly \
            -mountpoint "$mountpoint" \
            SparkleReleaseKit-macos.dmg
          trap 'hdiutil detach -quiet "$mountpoint" || true' EXIT
          codesign --verify --strict --verbose=2 "$mountpoint/sparklekit"
          spctl --assess --type execute --verbose=4 "$mountpoint/sparklekit"
          hdiutil detach -quiet "$mountpoint"
          trap - EXIT
          shasum -a 256 SparkleReleaseKit-macos.dmg > SparkleReleaseKit-macos.dmg.sha256
          /bin/rm -f "$notary_key"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Verify packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir package-check
          ditto -x -k SparkleReleaseKit-macos.zip package-check
          packaged="package-check/SparkleReleaseKit/sparklekit"
          "$packaged" version | grep -F "SparkleReleaseKit ${GITHUB_REF_NAME#v}"
          lipo "$packaged" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 "$packaged"
          install_dir="$RUNNER_TEMP/sparklekit-install"
          SPARKLEKIT_INSTALL_DIR="$install_dir" package-check/SparkleReleaseKit/install.sh
          "$install_dir/sparklekit" version | grep -F "SparkleReleaseKit ${GITHUB_REF_NAME#v}"
          codesign --verify --strict --verbose=2 "$install_dir/sparklekit"
          shasum -a 256 -c SparkleReleaseKit-macos.zip.sha256

      - name: Attest tested release metadata and binary package
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            SparkleReleaseKit-macos.zip
            SparkleReleaseKit-macos.zip.sha256
            sparklekit-update-manifest.json
            sparklekit-update-manifest.json.sig
            sparklekit-build-metadata.json

      - name: Attest notarized disk image
        if: steps.notarization.outputs.available == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            SparkleReleaseKit-macos.dmg
            SparkleReleaseKit-macos.dmg.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_AVAILABLE: ${{ steps.notarization.outputs.available }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            SparkleReleaseKit-macos.zip
            SparkleReleaseKit-macos.zip.sha256
            sparklekit-update-manifest.json
            sparklekit-update-manifest.json.sig
            sparklekit-build-metadata.json
          )
          if [[ "$DMG_AVAILABLE" == "true" ]]; then
            assets+=(
              SparkleReleaseKit-macos.dmg
              SparkleReleaseKit-macos.dmg.sha256
            )
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "SparkleReleaseKit ${GITHUB_REF_NAME#v}"

      - name: Remove ephemeral release credentials
        if: always()
        shell: bash
        env:
          RELEASE_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            /usr/bin/security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          /bin/rm -f \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
